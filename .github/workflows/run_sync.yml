name: Garmin to Sheets Sync

# Określamy, kiedy skrypt ma się uruchamiać
on:
  schedule:
    # Uruchamiaj codziennie o 22:00 czasu UTC (czyli 23:00 lub 24:00 czasu polskiego)
    - cron: '0 22 * * *'
  # Ta opcja pozwala na ręczne uruchomienie skryptu w zakładce "Actions" na GitHubie w celach testowych
  workflow_dispatch:

jobs:
  sync_data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install garminconnect gspread oauth2client

    
    - name: Run synchronization script
      env:
        GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
        GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      run: garmin-connect.py 